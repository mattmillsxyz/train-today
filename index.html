<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Train Today</title>
<meta property="og:title" content="Train Today">
<meta property="og:description" content="A daily training app for young multi-sport athletes. Soccer, football, track, strength, cardio, and plyometrics.">
<meta property="og:image" content="https://train-today.netlify.app/train-today-app-screenshot.png">
<meta property="og:url" content="https://train-today.netlify.app/">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  (function() {
    var s = localStorage.getItem('trainToday_theme');
    var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #22D68A;
    --green-light: #0d2e1f;
    --green-dark: #16a869;
    --blue: #4DA8FF;
    --amber: #F0A500;
    --red: #FF5C5C;
    --purple: #A89BFF;
    --pink: #FF7BAC;
    --text: #f0f0f0;
    --text-secondary: #888;
    --border: #2a2a2a;
    --bg: #0d0d0d;
    --card: #161616;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --green-light: #d4f5e9;
      --text: #1a1a1a;
      --text-secondary: #777;
      --border: #e0e0e0;
      --bg: #f0f0f0;
      --card: #ffffff;
    }
  }

  html[data-theme="light"] {
    --green-light: #d4f5e9;
    --text: #1a1a1a;
    --text-secondary: #777;
    --border: #e0e0e0;
    --bg: #f0f0f0;
    --card: #ffffff;
  }

  html[data-theme="dark"] {
    --green-light: #0d2e1f;
    --text: #f0f0f0;
    --text-secondary: #888;
    --border: #2a2a2a;
    --bg: #0d0d0d;
    --card: #161616;
  }

  html {
    background-color: var(--bg);
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    max-width: 600px;
    margin: 0 auto;
    padding: 0 12px 12px;
  }

  /* HEADER */
  .header-wrap {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding-top: 12px;
  }
  .header {
    background: var(--green);
    color: #0d0d0d;
    padding: 20px 16px 16px;
    border-radius: 20px 20px 0 0;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-btn {
    background: rgba(0,0,0,0.15);
    border: none;
    color: #0d0d0d;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-btn:active { background: rgba(255,255,255,0.35); }
  .header-date-label {
    font-size: 14px;
    opacity: 0.8;
    text-align: center;
  }
  .header-day-label {
    font-size: 16px;
    font-weight: 600;
    text-align: center;
  }
  .header-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.3px;
    text-align: center;
  }
  .header-meta {
    font-size: 15px;
    opacity: 0.8;
    margin-top: 2px;
    text-align: center;
  }
  .sport-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
    justify-content: center;
  }
  .sport-pill {
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 13px;
    font-weight: 500;
  }

  /* PROGRESS */
  .progress-bar-wrap {
    padding: 10px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
  }
  .progress-fill {
    height: 4px;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* ACTIVITIES */
  .activities { padding: 0; }

  .activity-item {
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .activity-item:last-child {
    border-bottom: none;
    border-radius: 0 0 20px 20px;
    overflow: hidden;
  }
  .activity-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }
  .check-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .check-circle.done {
    background: var(--green);
    border-color: var(--green);
  }
  .check-icon {
    display: none;
    color: white;
    font-size: 13px;
    font-weight: 700;
  }
  .check-circle.done .check-icon { display: block; }

  .activity-text { flex: 1; min-width: 0; }
  .activity-name {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.3;
  }
  .activity-name.done {
    text-decoration: line-through;
    color: var(--text-secondary);
  }
  .activity-duration {
    font-size: 15px;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .tag {
    display: block;
    font-size: 12px;
    font-weight: 600;
    padding: 0;
    background: none !important;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .tag-soccer { color: var(--green-dark); }
  .tag-cardio { color: #185FA5; }
  .tag-strength { color: #F0A500; }
  .tag-plyo { color: #A89BFF; }
  .tag-stretch { color: #FF7BAC; }
  .tag-football { color: #C87941; }
  .tag-track { color: #185FA5; }
  .tag-warmup { color: #38bdf8; }
  .tag-balance { color: #14B8A6; }

  .chevron {
    font-size: 18px;
    color: var(--text-secondary);
    margin-top: 2px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .chevron.open { transform: rotate(90deg); }

  .activity-detail {
    display: none;
    padding: 0 16px 16px 56px;
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.65;
  }
  .activity-detail.open { display: block; }
  .detail-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--green-dark);
    margin-bottom: 8px;
  }
  .detail-steps {
    list-style: none;
    counter-reset: step;
  }
  .detail-steps li {
    counter-increment: step;
    padding: 6px 0 6px 28px;
    position: relative;
    border-bottom: 1px solid var(--border);
  }
  .detail-steps li:last-child { border-bottom: none; }
  .detail-steps li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 8px;
    width: 20px;
    height: 20px;
    background: var(--green-light);
    color: var(--green-dark);
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* REST DAY */
  .rest-card {
    margin: 32px 16px;
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 32px 20px;
    text-align: center;
  }
  .rest-emoji { font-size: 48px; margin-bottom: 12px; }
  .rest-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .rest-sub { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }

  /* THEME TOGGLE */
  .theme-toggle-wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: 12px 12px 20px;
    display: flex;
    justify-content: center;
  }
  .theme-toggle {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    opacity: 0.5;
  }
  .theme-toggle:hover { opacity: 0.8; }
  .theme-toggle:active { opacity: 0.4; }

  /* WEEK STRIP */
  .week-strip {
    background: var(--green-dark);
    padding: 8px 16px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    justify-content: center;
  }
  .week-strip::-webkit-scrollbar { display: none; }
  .week-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 36px;
    padding: 4px 4px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .week-day.active { background: rgba(0,0,0,0.2); }
  .week-day-name { font-size: 11px; color: rgba(0,0,0,0.6); text-transform: uppercase; letter-spacing: 0.3px; }
  .week-day-num { font-size: 17px; font-weight: 600; color: #0d0d0d; }
  .week-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(0,0,0,0.3); }
  .week-dot.has-workout { background: rgba(0,0,0,0.6); }
  .week-day.today .week-day-num {
    background: #0d0d0d;
    color: var(--green);
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  /* START BUTTON */
  .start-btn {
    background: var(--green);
    color: #0d0d0d;
    border: none;
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    display: inline-block;
  }
  .start-btn:active { opacity: 0.8; }

  /* TIMER OVERLAY */
  #timerOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #22c55e;
    z-index: 100;
    flex-direction: column;
    overflow: hidden;
  }
  #timerOverlay.active { display: flex; }

  #timerTop {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px 20px;
  }
  #timerLabel {
    font-size: 18px;
    font-weight: 700;
    color: #000;
    text-align: center;
    opacity: 0.7;
    margin-bottom: 4px;
  }
  #timerDisplay {
    font-size: clamp(56px, 18vw, 100px);
    font-weight: 700;
    color: #000;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  #timerSteps {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 140px;
  }
  #timerSteps ol {
    list-style: none;
    counter-reset: step;
    margin: 0;
    padding: 0;
  }
  #timerSteps li {
    counter-increment: step;
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(0,0,0,0.12);
    font-size: 16px;
    font-weight: 500;
    color: #000;
    line-height: 1.5;
    align-items: flex-start;
  }
  #timerSteps li:last-child { border-bottom: none; }
  #timerSteps li::before {
    content: counter(step);
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    background: rgba(0,0,0,0.15);
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }

  #timerButtons {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 16px 24px 40px;
    background: none;
  }
  .timer-btn {
    background: #1aad52;
    color: #000;
    border: none;
    border-radius: 32px;
    padding: 14px 32px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    min-width: 120px;
  }
  .timer-btn:active { background: #178f44; }
  .timer-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .timer-btn.finish {
    background: #000;
    color: #22c55e;
  }
  #timerRestartBtn {
    background: #1aad52;
    color: #000;
    border: none;
    border-radius: 50%;
    width: 56px;
    height: 56px;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    align-self: center;
  }
  #timerRestartBtn:active { background: #178f44; }
</style>
</head>
<body>

<div id="app"></div>

<div class="theme-toggle-wrap">
  <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode"></button>
</div>

<div id="timerOverlay">
  <div id="timerTop">
    <div id="timerLabel"></div>
    <div id="timerDisplay">00:00</div>
  </div>
  <div id="timerSteps"><ol id="timerStepsList"></ol></div>
  <div id="timerButtons">
    <button id="timerRestartBtn" onclick="timerRestart()" title="Restart">↺</button>
    <button class="timer-btn" id="timerPauseBtn" onclick="timerTogglePause()">Pause</button>
    <button class="timer-btn finish" onclick="timerFinish()">Finish</button>
  </div>
</div>

<script>
// ─── ACTIVITY LIBRARY ──────────────────────────────────────────────────────

const ACTIVITIES = {

  // WARMUPS
  dynamicWarmup: {
    name: "Dynamic Warmup",
    duration: "8 min",
    tag: "warmup",
    steps: [
      "Jog in place for 1 minute to get your heart rate up.",
      "High knees: lift each knee up to your belly button while jogging, for 30 seconds.",
      "Butt kicks: kick your heels up toward your butt while jogging, for 30 seconds.",
      "Leg swings: hold a wall or fence, swing each leg forward and back 10 times.",
      "Arm circles: big circles forward 10 times, then backward 10 times.",
      "Hip circles: hands on hips, make big circles with your hips, 10 each way.",
      "Lateral shuffles: side-step quickly back and forth, for 30 seconds.",
    ]
  },

  // SOCCER
  jugglingBasic: {
    name: "Juggling Practice",
    duration: "10 min",
    tag: "soccer",
    steps: [
      "Drop the ball, let it bounce once, then kick it up with the top of your foot (laces). Catch it. Repeat.",
      "Once you feel comfortable, try to kick it twice before catching it.",
      "Keep your foot flat when you kick. Imagine your foot is a shelf the ball sits on.",
      "Count your best streak! Write it down and try to beat it tomorrow.",
      "If you get good, try alternating feet: right, left, right, left.",
    ]
  },
  coneDribbling: {
    name: "Cone Dribbling",
    duration: "12 min · 3 sets",
    tag: "soccer",
    steps: [
      "Set up 5 cones (or water bottles, shoes, anything!) in a straight line, about 3 feet apart.",
      "Dribble through them using only the inside of your foot. Go slow and controlled first.",
      "Come back through using the outside of your foot.",
      "Rest 30 seconds, then repeat. Try to go a little faster each set.",
      "Bonus: time yourself and try to beat your record!",
    ]
  },
  passAndMove: {
    name: "Wall Passing",
    duration: "10 min",
    tag: "soccer",
    steps: [
      "Stand about 6 feet from a wall or rebounder.",
      "Pass the ball firmly against the wall with the inside of your foot.",
      "Control the return with your opposite foot. Soft touch!",
      "Try 20 passes with your right foot, then 20 with your left foot.",
      "Move back a few feet once you're comfortable and repeat.",
    ]
  },
  shootingDrill: {
    name: "Shooting Practice",
    duration: "10 min",
    tag: "soccer",
    steps: [
      "Set up a goal (use cones or pick a spot on a wall/fence).",
      "Start 10 feet away. Shoot using your laces and make sure you follow through!",
      "Take 10 shots from straight on, then 10 from the left side, then 10 from the right.",
      "After each shot, jog to get the ball. Don't just walk!",
      "Try aiming for corners (low left, low right) instead of straight at the middle.",
    ]
  },
  firstTouchDrill: {
    name: "First Touch Drill",
    duration: "10 min",
    tag: "soccer",
    steps: [
      "Toss the ball up in the air about head height. Let it drop.",
      "Stop the ball dead with the sole (bottom) of your foot before it bounces twice.",
      "Then try stopping it with the inside of your foot.",
      "Do 15 reps each foot. The goal is a soft, controlled touch, not kicking it away.",
      "Challenge: toss higher and try to chest-trap it, then foot trap before it bounces.",
    ]
  },
  insideOutsideDribble: {
    name: "Inside/Outside Dribble",
    duration: "10 min",
    tag: "soccer",
    steps: [
      "In an open space, dribble forward tapping the ball with the inside of your right foot, then the outside.",
      "Inside tap, outside tap, inside tap, outside tap. Keep a rhythm.",
      "Do this for 20 yards, then turn around and come back.",
      "Repeat 4 times, then switch to your left foot.",
      "This improves your ball control and makes you harder to defend.",
    ]
  },

  // FOOTBALL
  routeRunning: {
    name: "Route Running",
    duration: "10 min",
    tag: "football",
    steps: [
      "Set up 2 cones: one where you start, one 10 yards ahead.",
      "Run hard to the cone, then cut sharply to the right (out route). Raise your hands like you're catching.",
      "Jog back. Repeat, this time cutting to the left.",
      "Do 6 reps each direction. Focus on planting your outside foot hard before cutting.",
      "Advanced: add a third cone and practice a corner route. Go straight, then cut out at 45°.",
    ]
  },
  handCatching: {
    name: "Catching Drills",
    duration: "10 min",
    tag: "football",
    steps: [
      "Toss a football up and catch with just your fingertips, not your palms.",
      "Run 5 yards, turn around, catch a toss. Eyes on the ball the whole time, not the catcher.",
      "Try catching while looking away, then turning at the last second.",
      "10 catches straight on, then run routes and catch: 5 cuts left, 5 cuts right.",
      "Remember: catch the ball, THEN tuck it in. Don't tuck early!",
    ]
  },
  footballAgility: {
    name: "Football Agility",
    duration: "10 min",
    tag: "football",
    steps: [
      "Set up 4 cones in a square about 5 yards apart.",
      "Sprint forward to the first cone, shuffle sideways to the second, backpedal to the third, shuffle back to start.",
      "This is called a 4-corner drill. It's used by real NFL players!",
      "Do 4 rounds, resting 30 seconds between each.",
      "Try to keep your hips low and stay on the balls of your feet. No flat-footed running!",
    ]
  },

  // CARDIO
  sprintIntervals: {
    name: "Sprint Intervals",
    duration: "12 min",
    tag: "cardio",
    steps: [
      "Find a flat area: a backyard, street, or park works great.",
      "Mark a start and end point about 30-40 yards apart.",
      "Sprint as FAST as you can from one end to the other.",
      "Walk back slowly. This is your rest.",
      "Do 8 sprints total. Rest 45 seconds after every 2 sprints.",
    ]
  },
  bikeRide: {
    name: "Bike Ride",
    duration: "20 min",
    tag: "cardio",
    steps: [
      "Gear up: helmet on, no shortcuts!",
      "Ride at a comfortable pace for the first 5 minutes to warm up your legs.",
      "For the middle 10 minutes, try to go a little faster. You should be breathing harder.",
      "Cool down the last 5 minutes at an easy pace.",
      "Try to explore a slightly different route each time!",
    ]
  },
  suicideSprints: {
    name: "Suicide Sprints",
    duration: "10 min",
    tag: "cardio",
    steps: [
      "Set up 4 cones in a line: 5 yards, 10 yards, 15 yards, and 20 yards from your start.",
      "Sprint to the first cone, touch it (or the ground), sprint back to start.",
      "Sprint to the second cone, back to start. Then third, then fourth.",
      "That's 1 full suicide. Rest 45 seconds and repeat.",
      "Try to complete 3-4 suicides. These are tough, so give everything!",
    ]
  },
  agilityLadder: {
    name: "Agility Ladder Work",
    duration: "10 min",
    tag: "cardio",
    steps: [
      "No ladder? Use chalk or tape on the ground to make 10 boxes, each about 18 inches.",
      "Run through stepping one foot in each box as fast as you can.",
      "Try lateral shuffles: step side to side through each box.",
      "Try the in-in-out-out pattern: both feet in, both feet out the sides, repeat.",
      "Rest 20 seconds between each pass. Do 3 passes of each pattern.",
    ]
  },

  // PLYOMETRICS
  boxJumps: {
    name: "Box Jumps",
    duration: "8 min · 3×8",
    tag: "plyo",
    steps: [
      "Find a sturdy box, step, or ledge about 12-18 inches high.",
      "Stand about 1 foot in front. Bend your knees, swing your arms back.",
      "Explode up: swing arms forward, jump, and land SOFTLY on top with bent knees.",
      "Step back down (don't jump down). Reset and go again.",
      "Do 8 jumps, rest 30 seconds, repeat 3 times. LAND SOFT, no loud thuds!",
    ]
  },
  broadJumps: {
    name: "Broad Jumps",
    duration: "8 min · 3×6",
    tag: "plyo",
    steps: [
      "Stand with feet shoulder-width apart. Bend your knees and swing arms back.",
      "Jump as FAR forward as you can. Use your arms to help propel you.",
      "Land softly with both feet, knees bent like a shock absorber.",
      "Mark where you landed. Try to beat your distance each jump!",
      "Do 6 jumps, rest 30 seconds, repeat 3 times.",
    ]
  },
  lateralBounds: {
    name: "Lateral Bounds",
    duration: "8 min · 3×8",
    tag: "plyo",

const today = new Date();
today.setHours(0,0,0,0);

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

let displayDate = new Date(today);

const expanded = {}; // dateKey+actId -> bool

// ─── LOCALSTORAGE PERSISTENCE ──────────────────────────────────────────────

const LS_KEY = 'trainToday_completed';

function loadChecked() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return {};
    const obj = JSON.parse(raw);
    const result = {};
    for (const [k, arr] of Object.entries(obj)) result[k] = new Set(arr);
    return result;
  } catch { return {}; }
}

function saveChecked() {
  const obj = {};
  for (const [k, s] of Object.entries(checked)) obj[k] = [...s];
  localStorage.setItem(LS_KEY, JSON.stringify(obj));
}

const checked = loadChecked();

function getChecked(dk) {
  if (!checked[dk]) checked[dk] = new Set();
  return checked[dk];
}

// ─── RENDER ────────────────────────────────────────────────────────────────

function formatDisplayDate(d) {
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function formatShortDate(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function isToday(d) {
  const t = new Date(); t.setHours(0,0,0,0);
  return d.getTime() === t.getTime();
}

function render() {
  const dk = dateKey(displayDate);
  const workout = getWorkoutForDate(displayDate);
  const ch = getChecked(dk);

  let html = '';

  // Header
  const totalMin = workout ? workout.activities.reduce((s, a) => {
    const m = parseInt(a.duration);
    return s + (isNaN(m) ? 0 : m);
  }, 0) : 0;

  html += `<div class="header-wrap"><div class="header">
    <div class="header-top">
      <div class="header-nav">
        <button class="nav-btn" onclick="shiftDay(-1)">‹</button>
      </div>
      <div style="text-align:center">
        <div class="header-date-label">${formatDisplayDate(displayDate)}</div>
        <div class="header-day-label"></div>
      </div>
      <div class="header-nav">
        <button class="nav-btn" onclick="shiftDay(1)">›</button>
      </div>
    </div>
    <div class="header-title">${workout ? workout.title : 'Rest Day'}</div>`;

  if (workout) {
    html += `<div class="header-meta">${workout.activities.length} activities · ~${totalMin} min</div>
    <div class="sport-pills">${workout.sports.map(s => `<span class="sport-pill">${s}</span>`).join('')}</div>`;
  }
  html += `</div></div>`;

  // Week strip
  html += buildWeekStrip();

  if (workout) {
    // Progress
    const doneCount = workout.activities.filter(a => ch.has(a.id)).length;
    const pct = Math.round((doneCount / workout.activities.length) * 100);
    html += `<div class="progress-bar-wrap">
      <div class="progress-row"><span>Progress</span><span>${doneCount} of ${workout.activities.length} done</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;

    // Activities
    html += `<div class="activities">`;
    for (const act of workout.activities) {
      const done = ch.has(act.id);
      const expKey = dk + act.id;
      const isExp = !!expanded[expKey];
      const tagClass = 'tag-' + act.tag;

      html += `<div class="activity-item">
        <div class="activity-row" onclick="toggleActivity('${dk}','${act.id}','${expKey}')">
          <div class="check-circle ${done ? 'done' : ''}" onclick="toggleCheck(event,'${dk}','${act.id}')">
            <span class="check-icon">✓</span>
          </div>
          <div class="activity-text">
            <div class="activity-name ${done ? 'done' : ''}">${act.name}</div>
            <span class="tag ${tagClass}">${act.tag}</span>
            <div class="activity-duration">${act.duration}</div>
            <button class="start-btn" onclick="startTimer(event,'${dk}','${act.id}',${parseDurationMin(act.duration)},'${act.name.replace(/'/g,"\\'")}')">▶ Start</button>
          </div>
          <div class="chevron ${isExp ? 'open' : ''}">›</div>
        </div>`;

      if (isExp && act.steps) {
        html += `<div class="activity-detail open">
          <div class="detail-title">How to do it:</div>
          <ol class="detail-steps">${act.steps.map(s => `<li>${s}</li>`).join('')}</ol>
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  document.getElementById('app').innerHTML = html;
}

function buildWeekStrip() {
  // Show week containing displayDate
  const weekStart = new Date(displayDate);
  const dow = weekStart.getDay();
  weekStart.setDate(weekStart.getDate() - dow); // go to Sunday

  let html = `<div class="week-strip" id="weekStrip">`;
  const days = ['S','M','T','W','T','F','S'];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    const dk = dateKey(d);
    const hasWorkout = true;
    const isActive = dateKey(d) === dateKey(displayDate);
    const isTod = isToday(d);

    html += `<div class="week-day ${isActive ? 'active' : ''} ${isTod ? 'today' : ''}" onclick="goToDate('${dk}')">
      <span class="week-day-name">${days[i]}</span>
      <span class="week-day-num">${d.getDate()}</span>
      <span class="week-dot ${hasWorkout ? 'has-workout' : ''}"></span>
    </div>`;
  }
  html += `</div>`;
  return html;
}

// ─── INTERACTIONS ──────────────────────────────────────────────────────────

function shiftDay(n) {
  displayDate.setDate(displayDate.getDate() + n);
  render();
  window.scrollTo(0, 0);
}

function goToDate(dk) {
  const parts = dk.split('-');
  displayDate = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  render();
  window.scrollTo(0, 0);
}

function toggleCheck(e, dk, actId) {
  e.stopPropagation();
  const ch = getChecked(dk);
  if (ch.has(actId)) ch.delete(actId); else ch.add(actId);
  saveChecked();
  render();
}

// ─── TIMER ─────────────────────────────────────────────────────────────────

let timerState = null; // { dk, actId, totalSecs, remaining, paused, interval }

function parseDurationMin(dur) {
  const m = parseInt(dur);
  return isNaN(m) ? 5 : m;
}

function playCompleteSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Three sharp buzzer bursts
    for (let i = 0; i < 3; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.value = 180;
      const t = ctx.currentTime + i * 0.45;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.6, t + 0.01);
      gain.gain.setValueAtTime(0.6, t + 0.28);
      gain.gain.linearRampToValueAtTime(0, t + 0.32);
      osc.start(t);
      osc.stop(t + 0.35);
    }
  } catch(e) {}
}

function timerTick() {
  if (!timerState || timerState.paused) return;
  timerState.remaining--;
  updateTimerDisplay();
  if (timerState.remaining <= 0) {
    clearInterval(timerState.interval);
    timerState.interval = null;
    document.getElementById('timerPauseBtn').disabled = true;
    playCompleteSound();
  }
}

function updateTimerDisplay() {
  const s = timerState.remaining;
  const m = Math.floor(s / 60);
  const sec = s % 60;
  document.getElementById('timerDisplay').textContent =
    String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function startTimer(e, dk, actId, durationMin, name) {
  e.stopPropagation();
  if (timerState) clearInterval(timerState.interval);
  const secs = durationMin * 60;
  timerState = { dk, actId, totalSecs: secs, remaining: secs, paused: false, interval: null };
  document.getElementById('timerLabel').textContent = name;
  const pauseBtn = document.getElementById('timerPauseBtn');
  pauseBtn.textContent = 'Pause';
  pauseBtn.disabled = false;
  const steps = (ACTIVITIES[actId] || {}).steps || [];
  document.getElementById('timerStepsList').innerHTML = steps.map(s => `<li>${s}</li>`).join('');
  updateTimerDisplay();
  timerState.interval = setInterval(timerTick, 1000);
  document.getElementById('timerOverlay').classList.add('active');
}

function timerTogglePause() {
  if (!timerState || timerState.remaining <= 0) return;
  timerState.paused = !timerState.paused;
  document.getElementById('timerPauseBtn').textContent = timerState.paused ? 'Resume' : 'Pause';
}

function timerRestart() {
  if (!timerState) return;
  clearInterval(timerState.interval);
  timerState.remaining = timerState.totalSecs;
  timerState.paused = false;
  const pauseBtn = document.getElementById('timerPauseBtn');
  pauseBtn.disabled = false;
  pauseBtn.textContent = 'Pause';
  updateTimerDisplay();
  timerState.interval = setInterval(timerTick, 1000);
}

function timerFinish() {
  if (!timerState) return;
  clearInterval(timerState.interval);
  const { dk, actId } = timerState;
  timerState = null;
  document.getElementById('timerOverlay').classList.remove('active');
  const ch = getChecked(dk);
  ch.add(actId);
  saveChecked();
  render();
}

function toggleActivity(dk, actId, expKey) {
  expanded[expKey] = !expanded[expKey];
  render();
}

// ─── THEME ─────────────────────────────────────────────────────────────────

const THEME_KEY = 'trainToday_theme';

const SUN_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
const MOON_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

function getEffectiveTheme() {
  return document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const toggle = document.getElementById('themeToggle');
  if (toggle) toggle.innerHTML = theme === 'dark' ? SUN_SVG : MOON_SVG;
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.content = theme === 'dark' ? '#0d0d0d' : '#f0f0f0';
}

function toggleTheme() {
  const next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}

// ─── BOOT ──────────────────────────────────────────────────────────────────
applyTheme(getEffectiveTheme());
render();
</script>
