<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Train Today</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #22D68A;
    --green-light: #0d2e1f;
    --green-dark: #16a869;
    --blue: #4DA8FF;
    --blue-light: #0d1e33;
    --amber: #F0A500;
    --amber-light: #2a1e05;
    --red: #FF5C5C;
    --red-light: #2a0f0f;
    --purple: #A89BFF;
    --purple-light: #1a1740;
    --pink: #FF7BAC;
    --pink-light: #2a0d1a;
    --text: #f0f0f0;
    --text-secondary: #888;
    --border: #2a2a2a;
    --bg: #0d0d0d;
    --card: #161616;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  /* HEADER */
  .header {
    background: var(--green);
    color: #0d0d0d;
    padding: 20px 16px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-btn {
    background: rgba(0,0,0,0.15);
    border: none;
    color: #0d0d0d;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-btn:active { background: rgba(255,255,255,0.35); }
  .header-date-label {
    font-size: 11px;
    opacity: 0.8;
    text-align: center;
  }
  .header-day-label {
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }
  .header-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-meta {
    font-size: 12px;
    opacity: 0.8;
    margin-top: 2px;
  }
  .sport-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .sport-pill {
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 500;
  }

  /* PROGRESS */
  .progress-bar-wrap {
    padding: 10px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
  }
  .progress-fill {
    height: 4px;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* ACTIVITIES */
  .activities { padding: 0 0 80px; }

  .activity-item {
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .activity-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }
  .check-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .check-circle.done {
    background: var(--green);
    border-color: var(--green);
  }
  .check-icon {
    display: none;
    color: white;
    font-size: 13px;
    font-weight: 700;
  }
  .check-circle.done .check-icon { display: block; }

  .activity-text { flex: 1; min-width: 0; }
  .activity-name {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
  }
  .activity-name.done {
    text-decoration: line-through;
    color: var(--text-secondary);
  }
  .activity-duration {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .tag-soccer { background: var(--green-light); color: var(--green-dark); }
  .tag-cardio { background: var(--blue-light); color: #185FA5; }
  .tag-strength { background: var(--amber-light); color: #F0A500; }
  .tag-plyo { background: var(--purple-light); color: #3C3489; }
  .tag-stretch { background: var(--pink-light); color: #FF7BAC; }
  .tag-football { background: var(--red-light); color: #791F1F; }
  .tag-track { background: var(--blue-light); color: #185FA5; }
  .tag-warmup { background: #222; color: #aaa; }

  .chevron {
    font-size: 18px;
    color: var(--text-secondary);
    margin-top: 2px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .chevron.open { transform: rotate(90deg); }

  .activity-detail {
    display: none;
    padding: 0 16px 14px 52px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.65;
  }
  .activity-detail.open { display: block; }
  .detail-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--green-dark);
    margin-bottom: 6px;
  }
  .detail-steps {
    list-style: none;
    counter-reset: step;
  }
  .detail-steps li {
    counter-increment: step;
    padding: 4px 0 4px 22px;
    position: relative;
    border-bottom: 1px solid var(--border);
  }
  .detail-steps li:last-child { border-bottom: none; }
  .detail-steps li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 5px;
    width: 16px;
    height: 16px;
    background: var(--green-light);
    color: var(--green-dark);
    border-radius: 50%;
    font-size: 9px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* REST DAY */
  .rest-card {
    margin: 32px 16px;
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 32px 20px;
    text-align: center;
  }
  .rest-emoji { font-size: 48px; margin-bottom: 12px; }
  .rest-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .rest-sub { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }

  /* TODAY BUTTON */
  .today-btn-wrap {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
  }
  .today-btn {
    background: var(--text);
    color: white;
    border: none;
    border-radius: 24px;
    padding: 10px 22px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    display: none;
  }
  .today-btn.visible { display: block; }

  /* WEEK STRIP */
  .week-strip {
    background: var(--green-dark);
    padding: 8px 16px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .week-strip::-webkit-scrollbar { display: none; }
  .week-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 36px;
    padding: 4px 4px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .week-day.active { background: rgba(0,0,0,0.2); }
  .week-day-name { font-size: 9px; color: rgba(0,0,0,0.6); text-transform: uppercase; letter-spacing: 0.3px; }
  .week-day-num { font-size: 14px; font-weight: 600; color: #0d0d0d; }
  .week-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(0,0,0,0.3); }
  .week-dot.has-workout { background: rgba(0,0,0,0.6); }
  .week-day.today .week-day-num {
    background: #0d0d0d;
    color: var(--green);
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
</style>
</head>

  // Theme rotation: every day has a workout — he decides his own rest days
  const weekPatterns = [
    // Mon, Tue, Wed, Thu, Fri, Sat, Sun
    ['soccer1','strength1','cardio1','soccer2','plyo1','football1','track1'],
    ['track1','strength2','soccer3','cardio2','football1','plyo2','soccer4'],
    ['soccer4','plyo2','strength3','soccer5','cardio3','football2','track2'],
    ['football2','strength4','soccer6','track2','plyo3','soccer1','strength1'],
    ['soccer1','cardio4','strength5','soccer2','plyo1','football2','track1'],
    ['track1','strength2','soccer3','cardio2','football1','plyo3','soccer5'],
    ['soccer4','plyo2','strength3','soccer5','cardio3','track2','football2'],
    ['football2','strength4','soccer6','track2','plyo3','soccer3','cardio4'],
    ['soccer1','cardio4','strength5','soccer2','plyo1','football1','track1'],
    ['track1','strength2','soccer3','cardio2','football2','plyo2','soccer6'],
  ];

  const dayWorkouts = {
    soccer1: {
      title: "Soccer Skills",
      activities: ['dynamicWarmup','jugglingBasic','coneDribbling','sprintIntervals','coolDownStretch'],
      sports: ['⚽ Soccer','🏃 Cardio']
    },
    soccer2: {
      title: "Soccer Focus",
      activities: ['dynamicWarmup','insideOutsideDribble','wallPassing','jumpSquats','coolDownStretch'],
      sports: ['⚽ Soccer','🤸 Plyo']
    },
    soccer3: {
      title: "Ball Control Day",
      activities: ['dynamicWarmup','jugglingBasic','firstTouchDrill','broadJumps','coolDownStretch'],
      sports: ['⚽ Soccer','🤸 Plyo']
    },
    soccer4: {
      title: "Shooting Day",
      activities: ['dynamicWarmup','shootingDrill','coneDribbling','pushups','coolDownStretch'],
      sports: ['⚽ Soccer','💪 Strength']
    },
    soccer5: {
      title: "Dribbling & Passing",
      activities: ['dynamicWarmup','insideOutsideDribble','wallPassing','suicideSprints','coolDownStretch'],
      sports: ['⚽ Soccer','🏃 Cardio']
    },
    soccer6: {
      title: "Full Soccer Session",
      activities: ['dynamicWarmup','jugglingBasic','shootingDrill','lateralBounds','hipMobility'],
      sports: ['⚽ Soccer','🤸 Plyo']
    },
    football1: {
      title: "Football Day",
      activities: ['dynamicWarmup','routeRunning','handCatching','tricepDips','coolDownStretch'],
      sports: ['🏈 Football','💪 Strength']
    },
    football2: {
      title: "Football Agility",
      activities: ['dynamicWarmup','footballAgility','routeRunning','plankHold','coolDownStretch'],
      sports: ['🏈 Football','💪 Strength']
    },
    track1: {
      title: "Track & Speed",
      activities: ['dynamicWarmup','strideDrills','trackSprints','boxJumps','coolDownStretch'],
      sports: ['🏃 Track','🤸 Plyo']
    },
    track2: {
      title: "Speed & Form",
      activities: ['dynamicWarmup','strideDrills','sprintIntervals','squats','coolDownStretch'],
      sports: ['🏃 Track','💪 Strength']
    },
    strength1: {
      title: "Strength Day",
      activities: ['dynamicWarmup','pushups','squats','mountainClimbers','plankHold','coolDownStretch'],
      sports: ['💪 Strength']
    },
    strength2: {
      title: "Strength Circuit",
      activities: ['dynamicWarmup','lunges','tricepDips','burpees','plankHold','coolDownStretch'],
      sports: ['💪 Strength']
    },
    strength3: {
      title: "Power Strength",
      activities: ['dynamicWarmup','squats','pushups','mountainClimbers','jumpSquats','coolDownStretch'],
      sports: ['💪 Strength','🤸 Plyo']
    },
    strength4: {
      title: "Full Body Strength",
      activities: ['dynamicWarmup','burpees','lunges','tricepDips','mountainClimbers','coolDownStretch'],
      sports: ['💪 Strength']
    },
    strength5: {
      title: "Strength & Core",
      activities: ['dynamicWarmup','pushups','plankHold','squats','lunges','coolDownStretch'],
      sports: ['💪 Strength']
    },
    cardio1: {
      title: "Cardio Day",
      activities: ['dynamicWarmup','suicideSprints','bikeRide','hipMobility'],
      sports: ['🏃 Cardio']
    },
    cardio2: {
      title: "Cardio Blast",
      activities: ['dynamicWarmup','sprintIntervals','agilityLadder','coolDownStretch'],
      sports: ['🏃 Cardio']
    },
    cardio3: {
      title: "Endurance Day",
      activities: ['dynamicWarmup','bikeRide','suicideSprints','coolDownStretch'],
      sports: ['🏃 Cardio']
    },
    cardio4: {
      title: "Speed Day",
      activities: ['dynamicWarmup','agilityLadder','sprintIntervals','broadJumps','hipMobility'],
      sports: ['🏃 Cardio','🤸 Plyo']
    },
    plyo1: {
      title: "Plyometrics Day",
      activities: ['dynamicWarmup','boxJumps','broadJumps','lateralBounds','coolDownStretch'],
      sports: ['🤸 Plyo']
    },
    plyo2: {
      title: "Explosive Power",
      activities: ['dynamicWarmup','jumpSquats','lateralBounds','broadJumps','mountainClimbers','coolDownStretch'],
      sports: ['🤸 Plyo','💪 Strength']
    },
    plyo3: {
      title: "Jump Training",
      activities: ['dynamicWarmup','boxJumps','jumpSquats','broadJumps','coolDownStretch'],
      sports: ['🤸 Plyo']
    }
  };

  // Fix: wall passing key
  ACTIVITIES['wallPassing'] = ACTIVITIES['passAndMove'];

  const dow = d.getDay(); // 0=Sun
  const patternDay = (dow + 6) % 7; // Mon=0 ... Sun=6
  const weekNum = Math.floor((d - EPOCH) / (7 * 86400000));
  // Cycle through patterns indefinitely
  const patternIndex = ((weekNum % weekPatterns.length) + weekPatterns.length) % weekPatterns.length;
  const workoutKey = weekPatterns[patternIndex][patternDay];
  const workout = dayWorkouts[workoutKey];

  if (!workout) return null;
  return {
    title: workout.title,
    sports: workout.sports,
    activities: workout.activities.map(k => ({ id: k, ...ACTIVITIES[k] }))
  };
}

// ─── STATE ─────────────────────────────────────────────────────────────────

const today = new Date();
today.setHours(0,0,0,0);

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

let displayDate = new Date(today);

const checked = {}; // dateKey -> Set of activity ids
const expanded = {}; // dateKey+actId -> bool

function getChecked(dk) {
  if (!checked[dk]) checked[dk] = new Set();
  return checked[dk];
}

// ─── RENDER ────────────────────────────────────────────────────────────────

function formatDisplayDate(d) {
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function formatShortDate(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function isToday(d) {
  const t = new Date(); t.setHours(0,0,0,0);
  return d.getTime() === t.getTime();
}

function render() {
  const dk = dateKey(displayDate);
  const workout = getWorkoutForDate(displayDate);
  const ch = getChecked(dk);

  let html = '';

  // Header
  const totalMin = workout ? workout.activities.reduce((s, a) => {
    const m = parseInt(a.duration);
    return s + (isNaN(m) ? 0 : m);
  }, 0) : 0;

  html += `<div class="header">
    <div class="header-top">
      <div class="header-nav">
        <button class="nav-btn" onclick="shiftDay(-1)">‹</button>
      </div>
      <div style="text-align:center">
        <div class="header-date-label">${formatDisplayDate(displayDate)}</div>
        <div class="header-day-label">${isToday(displayDate) ? '— Today —' : ''}</div>
      </div>
      <div class="header-nav">
        <button class="nav-btn" onclick="shiftDay(1)">›</button>
      </div>
    </div>
    <div class="header-title">${workout ? workout.title : 'Rest Day'}</div>`;

  if (workout) {
    html += `<div class="header-meta">${workout.activities.length} activities · ~${totalMin} min</div>
    <div class="sport-pills">${workout.sports.map(s => `<span class="sport-pill">${s}</span>`).join('')}</div>`;
  }
  html += `</div>`;

  // Week strip
  html += buildWeekStrip();

  if (workout) {
    // Progress
    const doneCount = workout.activities.filter(a => ch.has(a.id)).length;
    const pct = Math.round((doneCount / workout.activities.length) * 100);
    html += `<div class="progress-bar-wrap">
      <div class="progress-row"><span>Progress</span><span>${doneCount} of ${workout.activities.length} done</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;

    // Activities
    html += `<div class="activities">`;
    for (const act of workout.activities) {
      const done = ch.has(act.id);
      const expKey = dk + act.id;
      const isExp = !!expanded[expKey];
      const tagClass = 'tag-' + act.tag;

      html += `<div class="activity-item">
        <div class="activity-row" onclick="toggleActivity('${dk}','${act.id}','${expKey}')">
          <div class="check-circle ${done ? 'done' : ''}" onclick="toggleCheck(event,'${dk}','${act.id}')">
            <span class="check-icon">✓</span>
          </div>
          <div class="activity-text">
            <div class="activity-name ${done ? 'done' : ''}">${act.name}</div>
            <div class="activity-duration">${act.duration}</div>
            <span class="tag ${tagClass}">${act.tag}</span>
          </div>
          <div class="chevron ${isExp ? 'open' : ''}">›</div>
        </div>`;

      if (isExp && act.steps) {
        html += `<div class="activity-detail open">
          <div class="detail-title">How to do it:</div>
          <ol class="detail-steps">${act.steps.map(s => `<li>${s}</li>`).join('')}</ol>
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  document.getElementById('app').innerHTML = html;

  // Show/hide today button
  const todayBtn = document.getElementById('todayBtn');
  if (isToday(displayDate)) {
    todayBtn.classList.remove('visible');
  } else {
    todayBtn.classList.add('visible');
  }
}

function buildWeekStrip() {
  // Show week containing displayDate
  const weekStart = new Date(displayDate);
  const dow = weekStart.getDay();
  weekStart.setDate(weekStart.getDate() - dow); // go to Sunday

  let html = `<div class="week-strip" id="weekStrip">`;
  const days = ['S','M','T','W','T','F','S'];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    const dk = dateKey(d);
    const hasWorkout = true;
    const isActive = dateKey(d) === dateKey(displayDate);
    const isTod = isToday(d);

    html += `<div class="week-day ${isActive ? 'active' : ''} ${isTod ? 'today' : ''}" onclick="goToDate('${dk}')">
      <span class="week-day-name">${days[i]}</span>
      <span class="week-day-num">${d.getDate()}</span>
      <span class="week-dot ${hasWorkout ? 'has-workout' : ''}"></span>
    </div>`;
  }
  html += `</div>`;
  return html;
}

// ─── INTERACTIONS ──────────────────────────────────────────────────────────

function shiftDay(n) {
  displayDate.setDate(displayDate.getDate() + n);
  render();
  window.scrollTo(0, 0);
}

function goToDate(dk) {
  const parts = dk.split('-');
  displayDate = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  render();
  window.scrollTo(0, 0);
}

function goToToday() {
  displayDate = new Date(today);
  render();
  window.scrollTo(0, 0);
}

function toggleCheck(e, dk, actId) {
  e.stopPropagation();
  const ch = getChecked(dk);
  if (ch.has(actId)) ch.delete(actId); else ch.add(actId);
  render();
}

function toggleActivity(dk, actId, expKey) {
  expanded[expKey] = !expanded[expKey];
  render();
}

// ─── BOOT ──────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
